<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Funny traffic light with a radio antenna">
  <title>Classroom Traffic Lights</title>
  <defs>
    <radialGradient id="gr" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ff8f8f"/>
      <stop offset="1" stop-color="#ff4d4d"/>
    </radialGradient>
    <radialGradient id="go" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffc979"/>
      <stop offset="1" stop-color="#ffa534"/>
    </radialGradient>
    <radialGradient id="gg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#9bf0a9"/>
      <stop offset="1" stop-color="#57d86b"/>
    </radialGradient>
  </defs>

  <!-- radio antenna with signal arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M64 24V11" stroke="#94a3b8" stroke-width="3.5"/>
    <path d="M56 4.2Q52.5 8 56 11.8M72 4.2Q75.5 8 72 11.8" stroke="#38bdf8" stroke-width="2.6"/>
    <path d="M50.5 2.9Q45 8 50.5 13.1M77.5 2.9Q83 8 77.5 13.1" stroke="#7dd3fc" stroke-width="2.4" opacity="0.85"/>
  </g>
  <circle cx="64" cy="8" r="4.6" fill="#ff4d4d" stroke="#fff" stroke-width="1.6"/>

  <!-- housing -->
  <rect x="26" y="22" width="76" height="104" rx="19" fill="#0f172a" stroke="#cbd5e1" stroke-width="3.5"/>
  <rect x="31.5" y="27.5" width="65" height="93" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M38 36Q38 29 45 29" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- RED: panicked -->
  <g transform="translate(64 46) scale(.9) translate(-64 -49)">
    <circle cx="64" cy="49" r="19" fill="#ff4d4d" opacity="0.25"/>
    <circle cx="64" cy="49" r="16" fill="url(#gr)" stroke="#fff" stroke-width="1.6"/>
    <circle cx="57.5" cy="46.5" r="5.2" fill="#fff" stroke="#3b0d12" stroke-width="1.4"/>
    <circle cx="70.5" cy="46.5" r="5.2" fill="#fff" stroke="#3b0d12" stroke-width="1.4"/>
    <circle cx="58" cy="47.3" r="1.7" fill="#3b0d12"/>
    <circle cx="70" cy="47.3" r="1.7" fill="#3b0d12"/>
    <path d="M52.5 42L60 38M75.5 42L68 38" stroke="#3b0d12" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="64" cy="57.5" rx="4.2" ry="3.4" fill="#3b0d12"/>
    <path d="M62 56.5h4" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M77.5 37.5Q81 42.5 77.5 45.5Q74 42.5 77.5 37.5Z" fill="#7dd3fc" stroke="#0369a1" stroke-width="0.8"/>
  </g>

  <!-- ORANGE: puzzled "hmm?" -->
  <g transform="translate(64 75.5) scale(.9) translate(-64 -80)">
    <circle cx="64" cy="80" r="19" fill="#ffa534" opacity="0.25"/>
    <circle cx="64" cy="80" r="16" fill="url(#go)" stroke="#fff" stroke-width="1.6"/>
    <circle cx="57.5" cy="79" r="4.4" fill="#fff" stroke="#3a2005" stroke-width="1.4"/>
    <circle cx="58.8" cy="79.2" r="1.8" fill="#3a2005"/>
    <path d="M67 79.5h7.5" stroke="#3a2005" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M52.5 72.5Q57.5 69 62 72.5" fill="none" stroke="#3a2005" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M67 74L74.5 71.5" stroke="#3a2005" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M56.5 88.5Q60 86 63 88.5T70 88" fill="none" stroke="#3a2005" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- GREEN: chill smile -->
  <g transform="translate(64 105) scale(.9) translate(-64 -111)">
    <circle cx="64" cy="111" r="19" fill="#57d86b" opacity="0.25"/>
    <circle cx="64" cy="111" r="16" fill="url(#gg)" stroke="#fff" stroke-width="1.6"/>
    <path d="M52.5 109Q57.5 103.5 62.5 109M65.5 109Q70.5 103.5 75.5 109" fill="none" stroke="#0b3a16" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M54 114Q64 125 74 114Z" fill="#0b3a16" stroke="#0b3a16" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M58.5 118.2Q64 121 69.5 118.2Q64 116 58.5 118.2Z" fill="#ff8fa3"/>
    <circle cx="52.5" cy="114.5" r="2.2" fill="#ff8fa3" opacity="0.7"/>
    <circle cx="75.5" cy="114.5" r="2.2" fill="#ff8fa3" opacity="0.7"/>
  </g>
</svg>
