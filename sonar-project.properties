# SPDX-License-Identifier: AGPL-3.0-or-later
# The server namespaces provisioned projects per user and the scanner
# syncs the effective key/name back into this file; keep them as-is so
# later scans land on the same project.
sonar.projectKey=trafficlights_webapp
sonar.projectName=Trafficlights Webapp
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=crates,web/src,web/index.html,web/vite.config.ts,web/vitest.config.ts,scripts,docs/kb/housekeeping.mjs,docs/kb/graphify.mjs
sonar.tests=crates,web/tests
# Test inclusions also exclude these files from the main source scope.
# Rust unit tests inside src/** stay in the source scope, as in Git Graph Libre.
sonar.test.inclusions=crates/**/tests/**/*.rs,web/tests/**/*.test.ts,web/tests/**/*.test.tsx

# Generated output, WASM glue, dependencies, legacy reference, and local data stay out.
sonar.exclusions=**/target/**,web/node_modules/**,web/dist/**,web/src/wasm/**,coverage/**,web/coverage/**,graphify-out/**,old/**

# The Rust workspace manifest sits at the scanner's project root.
sonar.rust.cargo.manifestPaths=Cargo.toml

# Build/dev tooling runs outside the app and has no unit-test harness.
sonar.coverage.exclusions=scripts/**,web/vite.config.ts,web/vitest.config.ts,docs/kb/housekeeping.mjs,docs/kb/graphify.mjs
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust-lcov.info
sonar.typescript.tsconfigPaths=web/tsconfig.json
