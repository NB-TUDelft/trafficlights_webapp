# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = ["crates/proto", "crates/wasm", "crates/server"]

[workspace.package]
edition = "2021"
rust-version = "1.98"
version = "0.1.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/NB-TUDelft/trafficlights_webapp"

# Every dependency here must be compatible with AGPL-3.0-or-later (see
# "Licensing" in the knowledge base). Crates opt in with `<name>.workspace = true`.
[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "fs",
  "io-util",
] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
rand = "0.8"
subtle = "2"
# Must match the installed wasm-bindgen CLI (`wasm-bindgen --version`), which
# rejects a module built with a different version.
wasm-bindgen = "=0.2.129"
serde-wasm-bindgen = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
